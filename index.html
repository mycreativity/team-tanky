<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>team-tanky — prototype spike</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🛡️</text></svg>" />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js"
    }
  }
  </script>
</head>
<body>
  <!-- Username onboarding (laagdrempelig, prototype) -->
  <div id="overlay">
    <div class="panel">
      <h1>team-tanky</h1>
      <p class="tag">prototype spike — jij + AI-team vs. de bully</p>
      <label for="username">Kies een username</label>
      <input id="username" maxlength="16" autocomplete="off" placeholder="bijv. Jasper" />
      <button id="start">Spelen</button>
      <p class="hint">Desktop: WASD rijden · muis richt de turret · muisknop schiet.<br/>Mobiel: links rijden, rechts richten &amp; schieten (kleine aim-assist).</p>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="topbar">
      <span id="who"></span>
      <span id="score"></span>
    </div>
    <button id="newmap">🔀 Nieuwe map</button>
    <button id="fsbtn" title="Fullscreen">⛶</button>
    <span id="seedlabel"></span>
    <div id="playerhp"><div id="playerhp-fill"></div><span id="playerhp-label">HP</span></div>
    <div id="bullyparts">
      <div class="ptitle">BULLY</div>
      <div class="pb"><span>Romp</span><div class="pbf" id="pb-hull"></div></div>
      <div class="pb"><span>Toren</span><div class="pbf" id="pb-turret"></div></div>
      <div class="pb"><span>Rups L</span><div class="pbf" id="pb-trackL"></div></div>
      <div class="pb"><span>Rups R</span><div class="pbf" id="pb-trackR"></div></div>
    </div>
    <div id="toast"></div>
  </div>

  <!-- Draai-hint: alleen zichtbaar in portrait op mobiel -->
  <div id="rotate"><div>🔄<br/>Draai je toestel naar<br/><b>landscape</b> om te spelen</div></div>

  <!-- Touch controls: links rijden, rechts richten + schieten -->
  <div id="joystick" class="hidden"><div id="joystick-knob"></div></div>
  <div id="aimstick" class="hidden"><div id="aimstick-knob"></div></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
